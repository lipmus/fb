[project]
name = "fawatch"
version = "1.0.0"
description = "Facebook Auto Watch Manager (Multi-Akun) - queue link, durasi per link, auto-scroll, worker paralel per akun"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "pywebview>=5.0",
    "psutil>=5.9",
    "openpyxl>=3.1",
]

[project.scripts]
fawatch = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
